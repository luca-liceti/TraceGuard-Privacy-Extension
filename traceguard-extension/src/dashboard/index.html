<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' http://localhost:11434 http://localhost:5173 ws://localhost:5173; object-src 'none'; base-uri 'self'; form-action 'none';">
  <title>TraceGuard Dashboard</title>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      background: #fff;
      color: #262626;
      font: 14px Inter, system-ui, sans-serif;
    }

    .startup-loading {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .startup-loading::before {
      width: 1.25rem;
      height: 1.25rem;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      content: "";
      animation: startup-spin 0.8s linear infinite;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background: #252525;
        color: #f5f5f5;
      }
    }

    @keyframes startup-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"><div class="startup-loading" role="status">Loading TraceGuard</div></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
