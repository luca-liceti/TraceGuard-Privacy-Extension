<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' http://localhost:11434 https://api.tosdr.org https://raw.githubusercontent.com http://localhost:5173 ws://localhost:5173; object-src 'none'; base-uri 'self'; form-action 'none';">
    <title>TraceGuard Popup</title>
    <style>
        html,
        body {
            width: 360px;
            margin: 0;
            padding: 0;
        }

        /*
         * Chromium clamps action popups to 800x600, and viewport units inside
         * a popup are measured against the popup itself: a 100vh layout can
         * lock the popup to its first-paint size and leave the lower half of
         * the UI unreachable. Pin the document to the allowed height instead,
         * and let the app's own scroll region handle the overflow.
         */
        body {
            height: 600px;
            overflow: hidden;
        }

        #root {
            height: 100%;
        }

        .startup-loading {
            display: flex;
            height: 100%;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: #fff;
            color: #262626;
            font: 14px Inter, system-ui, sans-serif;
        }

        .startup-loading::before {
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            content: "";
            animation: startup-spin 0.8s linear infinite;
        }

        @media (prefers-color-scheme: dark) {
            .startup-loading {
                background: #252525;
                color: #f5f5f5;
            }
        }

        @keyframes startup-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="root"><div class="startup-loading" role="status">Loading TraceGuard...</div></div>
    <script type="module" src="./main.tsx"></script>
</body>

</html>
