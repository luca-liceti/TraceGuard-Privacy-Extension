name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: traceguard-extension/package-lock.json
        
    - name: Install dependencies
      working-directory: ./traceguard-extension
      run: npm ci
      
    - name: Run ESLint
      working-directory: ./traceguard-extension
      run: npm run lint
      
    - name: Run Build
      working-directory: ./traceguard-extension
      run: npm run build
