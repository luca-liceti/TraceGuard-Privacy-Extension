name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: traceguard-extension/package-lock.json
        
    - name: Install dependencies
      working-directory: ./traceguard-extension
      run: npm ci --legacy-peer-deps
      
    - name: Run Tests
      working-directory: ./traceguard-extension
      run: npm run test:run
      
    - name: Run Build
      working-directory: ./traceguard-extension
      run: npm run build

    - name: Sign threat feed
      if: ${{ secrets.THREAT_SIGNING_KEY != '' }}
      working-directory: ./traceguard-extension
      env:
        THREAT_SIGNING_KEY: ${{ secrets.THREAT_SIGNING_KEY }}
      run: npm run sign:phishlist
      
    - name: Package Extension
      working-directory: ./traceguard-extension
      run: |
        cd dist
        zip -r ../traceguard-extension-${{ github.ref_name }}.zip ./*
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          traceguard-extension/traceguard-extension-${{ github.ref_name }}.zip
          traceguard-extension/src/assets/phishlist.signed.json
        generate_release_notes: true
