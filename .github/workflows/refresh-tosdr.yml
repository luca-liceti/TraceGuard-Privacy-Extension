name: Refresh ToS;DR ratings

# Rebuilds the bundled ToS;DR catalog weekly so the extension ships with fresh
# privacy-policy ratings. This is what keeps opted-out users current: they never
# make a live lookup, so their ratings only move when a release carries a newer
# bundle. The build is incremental against the committed shards, so it refetches
# only the services whose ToS;DR record changed and finishes in minutes.
# The build script validates the output and aborts (rather than degrading) if the
# fetch returns malformed or empty data, so a broken run never reaches this commit.
on:
  schedule:
    - cron: '0 4 * * 3' # Wednesdays 04:00 UTC (offset from the Monday threat-feed run)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'

      # The build script needs no dependencies, only Node's stdlib, so there is
      # no npm ci here. It reuses the committed shards and only fetches services
      # whose ToS;DR `updated_at` moved.
      - name: Rebuild ToS;DR catalog
        working-directory: ./traceguard-extension
        run: npm run build:tosdr

      - name: Commit refreshed catalog
        working-directory: ./traceguard-extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/tosdr-index.json src/assets/tosdr/details
          if git diff --cached --quiet; then
            echo "ToS;DR catalog already up to date."
          else
            git commit -m "chore(tosdr): refresh bundled privacy-policy ratings"
            git push
          fi
