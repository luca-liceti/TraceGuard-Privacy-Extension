name: Commit messages

# Runs on every push and every pull request, on every branch, because this is
# the check that must not depend on anyone remembering. It installs nothing, so
# it costs a few seconds.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assistant-credit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        # The whole history is fetched so the range of commits a push or pull
        # request added can be resolved. Commits that predate the rule are never
        # checked: only the ones inside the range are.
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '20.x'

    - name: Check commit messages for assistant credit
      shell: bash
      env:
        # The refs are passed through the environment rather than interpolated
        # into the shell string, matching the release workflow's practice.
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.sha }}
        ZERO_SHA: 0000000000000000000000000000000000000000
      run: |
        if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
          RANGE="${BASE_SHA}..${HEAD_SHA}"
        elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ]; then
          RANGE="${BEFORE_SHA}..${HEAD_SHA}"
        else
          RANGE=""
        fi

        if [ -z "$RANGE" ]; then
          echo "No comparable range for this event, checking the tip commit only."
          node traceguard-extension/scripts/check-commit-messages.mjs --last 1
        else
          node traceguard-extension/scripts/check-commit-messages.mjs --range "$RANGE"
        fi
